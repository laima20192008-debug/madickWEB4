<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ссылки на кастомные стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Карточка формы -->
                <div class="card border-0 shadow-lg p-4 rounded-4 main-card">
                    <h2 class="text-white p-3 rounded-3 mb-4 card-header-custom">Book a train ticket</h2>
                    
                    <form>
                        <!-- Переключатель One way / Round trip (радиокнопки) -->
                        <div class="mb-3 d-flex gap-2">
                            <input type="radio" class="btn-check" name="tripType" id="oneway" checked>
                            <label class="btn btn-outline-success rounded-pill px-4" for="oneway">One way</label>

                            <input type="radio" class="btn-check" name="tripType" id="roundtrip">
                            <label class="btn btn-outline-success rounded-pill px-4" for="roundtrip">Round trip</label>
                        </div>

                        <!-- Поля From и To -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="from" class="form-label text-muted small">From</label>
                                <input type="text" class="form-control" id="from" value="Astana" required>
                            </div>
                            <div class="col-md-6">
                                <label for="to" class="form-label text-muted small">To</label>
                                <input type="text" class="form-control" id="to" value="Almaty" required>
                            </div>
                        </div>

                        <!-- Поля Departure, Return, Passengers -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="departure" class="form-label text-muted small">Departure</label>
                                <input type="date" class="form-control" id="departure" required>
                            </div>
                            <div class="col-md-4">
                                <label for="returnDate" class="form-label text-muted small">Return</label>
                                <input type="date" class="form-control" id="returnDate">
                            </div>
                            <div class="col-md-4">
                                <label for="passengers" class="form-label text-muted small">Passengers</label>
                                <select class="form-select" id="passengers" required>
                                    <option value="1">1 adult</option>
                                    <option value="2">2 adults</option>
                                    <option value="3">3 adults</option>
                                    <option value="4">4 adults</option>
                                    <option value="5">5 adults</option>
                                    <option value="6">6 adults</option>
                                </select>
                            </div>
                        </div>

                        <!-- Carriage class -->
                        <div class="mb-3">
                            <label class="form-label text-muted small d-block">Carriage class</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="carriageClass" id="seat" checked required>
                                    <label class="form-check-label" for="seat">Seat</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="carriageClass" id="coupe" required>
                                    <label class="form-check-label" for="coupe">Coupé</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" required>
                                    <label class="form-check-label" for="sleeper">Sleeper</label>
                                </div>
                            </div>
                        </div>

                        <!-- Phone and Email -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label text-muted small">Phone</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-success text-white">+7</span>
                                    <input type="tel" class="form-control" id="phone" placeholder="701 234 56 78" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label text-muted small">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <!-- Чекбоксы (SMS и правила) -->
                        <div class="mb-3">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" role="switch" id="smsCheck">
                                <label class="form-check-label" for="smsCheck">Also send the ticket by SMS</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rulesCheck" required>
                                <label class="form-check-label" for="rulesCheck">I agree with the carriage rules</label>
                            </div>
                        </div>

                        <!-- Кнопки управления (на телефоне Find trains выше Clear с помощью order) -->
                        <div class="d-flex flex-column flex-md-row gap-2 mt-4">
                            <button type="submit" class="btn btn-warning text-white fw-bold py-2 order-1 order-md-2 flex-grow-1">Find trains</button>
                            <button type="reset" class="btn btn-outline-secondary py-2 order-2 order-md-1 px-4">Clear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
